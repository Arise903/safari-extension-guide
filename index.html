  <title>启用 Safari 扩展 · 广告拦截器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7ff;
      --card: rgba(255, 255, 255, .86);
      --text: #172033;
      --muted: #697185;
      --blue: #287ff0;
      --blue-soft: #e7f0ff;
      --line: rgba(33, 48, 78, .09);
      --shadow: 0 18px 50px rgba(67, 89, 145, .14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: max(24px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at 50% -10%, #fff 0, var(--bg) 52%, #eef3ff 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 560px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
    .back-link, .lang-select { border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--muted); font: inherit; font-size: 12px; padding: 8px 12px; text-decoration: none; }
    .lang-select { appearance: none; -webkit-appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 13px) 11px, calc(100% - 9px) 11px; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
    .page-nav { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
    .page-nav::-webkit-scrollbar { display: none; }
    .page-nav a { flex: 0 0 auto; padding: 8px 12px; border-radius: 999px; color: var(--muted); background: rgba(255,255,255,.45); border: 1px solid transparent; font-size: 12px; text-decoration: none; }
    .page-nav a.active { color: var(--blue); background: var(--blue-soft); border-color: rgba(40,127,240,.16); font-weight: 650; }
    .hero { text-align: center; padding: 18px 8px 22px; }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 23px;
      display: grid; place-items: center; color: #fff; font-size: 34px;
      background: linear-gradient(145deg, #54a8ff, #176ce7);
      box-shadow: 0 12px 26px rgba(35, 119, 237, .28);
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.5px; }
    .subtitle { margin: 10px auto 0; color: var(--muted); font-size: 16px; line-height: 1.55; }
    .notice, .step, .fallback {
      border: 1px solid var(--line); border-radius: 24px; background: var(--card);
      box-shadow: var(--shadow); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .notice { padding: 17px 18px; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-start; }
    .notice-icon { width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center; border-radius: 50%; background: var(--blue-soft); color: var(--blue); font-weight: 700; }
    .notice strong { display: block; margin-bottom: 4px; font-size: 15px; }
    .notice span { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .steps { display: grid; gap: 12px; }
    .step { padding: 19px; display: grid; grid-template-columns: 42px 1fr; gap: 14px; align-items: start; }
    .number { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue); font-size: 18px; font-weight: 750; }
    .step h2 { margin: 1px 0 7px; font-size: 17px; }
    .step p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .path { display: inline-flex; margin-top: 10px; padding: 7px 10px; border-radius: 9px; background: #f0f3f9; color: #4e5b72; font-size: 13px; }
    .fallback { margin-top: 16px; padding: 18px; }
    .fallback h2 { margin: 0 0 8px; font-size: 16px; }
    .fallback p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .done { margin-top: 18px; padding: 17px 18px; border-radius: 20px; background: #eaf8f2; color: #236d51; font-size: 14px; line-height: 1.55; }
    footer { padding: 22px 8px 0; text-align: center; color: #8a93a6; font-size: 12px; }
    .footer-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
    .footer-links a { color: inherit; }
    @media (max-width: 380px) {
      body { padding-left: 12px; padding-right: 12px; }
      .step { grid-template-columns: 36px 1fr; gap: 10px; padding: 15px; }
      .number { width: 36px; height: 36px; border-radius: 12px; font-size: 16px; }
      h1 { font-size: 25px; }
      .back-link, .lang-select { padding-left: 9px; padding-right: 9px; }
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg: #111521; --card: rgba(31, 38, 55, .86); --text: #f4f6fc; --muted: #aab3c5; --blue-soft: #1c355e; --line: rgba(255,255,255,.1); --shadow: 0 18px 50px rgba(0,0,0,.25); }
      .path { background: #293246; color: #d3dbeb; }
      .done { background: #15392d; color: #a8e1c8; }
    }
  </style>
</head>

      const stepText = (zh, en, ja) => ({ zh, en, ja })[language] || en || zh;

      const steps = document.querySelector('#steps');
      content.steps.forEach((step, index) => {
        const article = document.createElement('article');
        article.className = 'step';
        const translatedStep = general?.steps[index];
        article.innerHTML = `<div class="number">${index + 1}</div><div><h2>${translatedStep?.[0] || stepText(step[0], step[1], step[2])}</h2><p>${translatedStep?.[1] || stepText(step[3], step[4], step[4])}</p></div>`;
        steps.appendChild(article);
      });

      const nav = document.querySelector('#page-nav');
      Object.entries(copy.pages).forEach(([key, label]) => {
        const link = document.createElement('a');
        link.href = `?page=${encodeURIComponent(key)}&lang=${language}`;
        link.textContent = label;
        link.className = key === pageKey ? 'active' : '';
        link.setAttribute('aria-current', key === pageKey ? 'page' : 'false');
        nav.appendChild(link);
      });

      document.querySelector('#language-select').addEventListener('change', (event) => {
        const next = new URL(location.href);
        next.searchParams.set('lang', event.target.value);
        next.searchParams.set('page', pageKey);
        location.href = next.toString();
