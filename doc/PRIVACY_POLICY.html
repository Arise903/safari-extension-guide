<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隐私政策 / Privacy Policy — Ad Blocker</title>
<style>
  :root{
    --bg:#f4f6fb;--surface:#ffffff;--fg:#1f2430;--muted:#5b6473;--line:#e6e9f0;
    --accent:#3b5bdb;--accent-2:#5c7cfa;--accent-soft:#eef2ff;--accent-deep:#1c2e6b;
    --ok:#0f9d58;--ok-soft:#e6f6ed;--shadow:0 10px 30px rgba(28,46,107,.08);
    --radius:16px;
  }
  *{box-sizing:border-box;scroll-behavior:smooth}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 220px);color:var(--fg);line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}
  .hero{background:linear-gradient(135deg,var(--accent-deep) 0%,var(--accent) 55%,var(--accent-2) 100%);
    color:#fff;padding:38px 0 30px;box-shadow:var(--shadow)}
  .hero-inner{max-width:980px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .logo{flex:0 0 auto;width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.3)}
  .logo svg{width:34px;height:34px}
  .hero h1{margin:0;font-size:25px;font-weight:700;letter-spacing:.3px}
  .hero .sub{margin-top:4px;font-size:14px;opacity:.9}
  .meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
  .pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;
    padding:5px 13px;font-size:12.5px;color:#fff;backdrop-filter:blur(4px)}

  .layout{max-width:980px;margin:-20px auto 0;padding:0 20px 70px;display:grid;grid-template-columns:1fr 220px;gap:26px;align-items:start}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}

  .main{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 30px 34px;min-width:0}

  .toc{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 14px;font-size:13.5px}
  .toc h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .toc a{display:block;color:var(--fg);text-decoration:none;padding:6px 10px;border-radius:8px;line-height:1.35;transition:.15s}
  .toc a:hover{background:var(--accent-soft);color:var(--accent)}
  .toc a.active{background:var(--accent);color:#fff;font-weight:600}
  @media (max-width:860px){.toc{display:none}}

  .topbar{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.82);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:10px 0}
  .topbar-inner{max-width:980px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px}
  .topbar .brand{font-weight:700;color:var(--accent-deep);font-size:15px;display:flex;align-items:center;gap:8px}
  .topbar .brand .dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:inline-flex;align-items:center;justify-content:center}
  .topbar .brand .dot svg{width:14px;height:14px}
  .lang-wrap{margin-left:auto;position:relative}
  #langSel{appearance:none;-webkit-appearance:none;padding:9px 38px 9px 14px;border:1px solid var(--line);border-radius:10px;
    font-size:14.5px;background:var(--surface);color:var(--fg);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);font-weight:500}
  .lang-wrap::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}

  section{margin:0 0 30px;scroll-margin-top:70px}
  section:last-of-type{margin-bottom:0}
  h2{font-size:19px;margin:0 0 14px;padding:12px 16px;border-radius:12px;background:var(--accent-soft);color:var(--accent-deep);
    display:flex;align-items:center;gap:10px;font-weight:700}
  h2 .idx{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;
    display:inline-flex;align-items:center;justify-content:center}
  h3{font-size:15.5px;margin:18px 0 10px;color:var(--fg);font-weight:600}
  p{margin:0 0 12px;color:var(--fg)}
  ul{margin:0 0 14px;padding:0;list-style:none}
  ul li{position:relative;padding:6px 0 6px 30px;border-bottom:1px dashed var(--line);color:var(--fg)}
  ul li:last-child{border-bottom:none}
  ul li::before{content:"";position:absolute;left:8px;top:13px;width:8px;height:8px;border-radius:50%;
    background:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
  .rtl ul li{padding:6px 30px 6px 0}
  .rtl ul li::before{left:auto;right:8px}

  table{width:100%;border-collapse:separate;border-spacing:0;margin:12px 0 18px;font-size:13.5px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{border-bottom:1px solid var(--line);padding:11px 13px;text-align:left;vertical-align:top}
  th{background:var(--accent-deep);color:#fff;font-weight:600;font-size:13px;letter-spacing:.02em}
  tbody tr:nth-child(even){background:#f8f9fe}
  tbody tr:last-child td{border-bottom:none}
  td:first-child{font-weight:600;color:var(--accent-deep);white-space:nowrap}

  code{background:var(--accent-soft);border:1px solid #dbe3ff;border-radius:6px;padding:1px 7px;font-size:12.5px;color:var(--accent-deep)}
  .note{background:var(--ok-soft);border:1px solid #bfe6cf;border-left:5px solid var(--ok);border-radius:12px;
    padding:16px 18px;font-size:14px;color:#0c5132;margin:0 0 26px;display:flex;gap:12px}
  .note .ic{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .note b{color:#093f27}

  footer{margin-top:34px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:13px;text-align:center}
  footer .links{margin-bottom:8px}
  footer a{color:var(--accent);text-decoration:none}
  footer a:hover{text-decoration:underline}

  .rtl{direction:rtl;text-align:right}
  .rtl h2,.rtl p,.rtl h3{text-align:right}
  .rtl table th,.rtl table td{text-align:right}
  .rtl h2 .idx{order:2}
  @media (max-width:560px){.main{padding:22px 16px}.hero h1{font-size:21px}table{font-size:12.5px;display:block;overflow-x:auto;white-space:nowrap}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="brand">
      <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4"/></svg></span>

</div>

<header class="hero">
  <div class="hero-inner">
    <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3z"/><path d="M5 13l4 4 10-10"/></svg></span>

        <span class="pill" id="t-pill3"></span>

    </div>

</header>

<div class="layout">
  <main class="main">
    <div id="content"></div>
    <footer>
      <div class="links">
        <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">↑ <span id="t-top">回到顶部</span></a>
      </div>
      <p id="t-foot"></p>
    </footer>

  <aside class="toc" id="toc">

</div>

      {t:"p",v:"すべてのルール・統計・設定は他アプリからアクセスできないアプリ専用サンドボックスに保存されます。当チームはお客様のデータを受信・保存するサーバーを運用していません。ローカルデータは標準的なデバイス内保存で保管されます。DNS クエリはお客様が選択した上游リゾルバ（Cloudflare / Google / AdGuard 等）にのみ転送され、クエリ内容が開発者と共有されることはありません。"}
    ]},
    {h2:"4. データ保持",blocks:[
      {t:"p",v:"当チームはいかなる個人データもサーバーに送信しないため、サーバー側での個人データ保持はありません。デバイス内の統計とログは、アプリデータの削除やアンインストール時に消去されます。"}
    ]},
    {h2:"5. ネットワーク権限について",blocks:[
      {t:"table",head:["権限","目的"],rows:[
        ["INTERNET","正当な DNS クエリを選択した上游 DNS へ転送"],
        ["ACCESS_NETWORK_STATE","ネットワーク状態を検知し VPN を確立・復元"],
        ["QUERY_ALL_PACKAGES","元アプリ別にローカル遮断統計を表示（アプリ一覧はローカル参照のみ、アップロードせず）"],
        ["FOREGROUND_SERVICE / FOREGROUND_SERVICE_SPECIAL_USE","特別用途のフォアグラウンドサービスとしてローカル VPN を実行"],
        ["POST_NOTIFICATIONS","VPN 状態の通知を表示"],
        ["RECEIVE_BOOT_COMPLETED","再起動後に設定に応じて遮断を復元"]
      ]}
    ]},
    {h2:"6. 第三者サービス",blocks:[
      {t:"p",v:"本アプリに第三者の分析・広告・クラッシュレポート SDK は含まれていません。公開フィルタールールを取得するため、標準 HTTPS で提供元（AdGuard の公開フィルターリスト等）からルールファイルをダウンロードします。この過程で転送されるのはルール本文のみで、お客様の個人データや DNS クエリは含まれません。内蔵ブラウザーはシステムの WebView を使用し、その通信はデバイスのブラウザー自体の方針に従います。"}
    ]},
    {h2:"7. 児童のプライバシー",blocks:[
      {t:"p",v:"本アプリは 13 歳未満の児童を対象としておらず、いかなる年齢層の個人データも意図的に収集しません。"}
    ]},
    {h2:"8. お客様の権利",blocks:[
      {t:"p",v:"当チームはいかなる個人データも収集・アップロードしていないため、サーバー上のデータを削除・エクスポートする必要はありません。いつでもアプリをアンインストールしてすべてのローカルデータを消去できます。"}
    ]},
    {h2:"9. ポリシーの変更",blocks:[
      {t:"p",v:"将来データの取り扱いが変更される場合、本書の生效日を更新し、ユーザーに説明します。"}
    ]},
    {h2:"10. お問い合わせ",blocks:[
      {t:"p",v:"本ポリシーに関するご質問は、アプリ内フィードバック窓口またはプロジェクトのリポジトリ Issues までお寄せください。"}
    ]}
  ],
  foot:"本ポリシーは簡体字中国語および英語で提供されます。Ad Blocker · 生效日 2026-08-07"
},

ko:{
  title:"개인정보 처리방침", sub:"Ad Blocker · 기기 내 VPN / DNS 광고 및 추적 차단 도구",
  pills:["시행일: 2026-08-07","관리자: Ad Blocker 개발팀","데이터 최소화"],
  note:"본 앱의 모든 차단·통계·진단 처리는 사용자의 기기 내에서 이루어집니다. 어떠한 개인 데이터도 수집·업로드·공유하지 않습니다. 계정 시스템, 광고 SDK, 분석 SDK, 크래시 보고 서비스는 포함되어 있지 않습니다.",
  sections:[
    {h2:"1. 개요",blocks:[
      {t:"p",v:"본 앱은 기기 내에서 동작하는 광고 차단기입니다. Android VpnService를 사용하여 DNS 계층에서 광고, 추적기, 악성 도메인을 차단합니다. 모든 차단·통계·진단 처리는 기기 내에서 이루어집니다."},
      {t:"p",v:"당사는 '데이터 최소화' 원칙에 따라 어떠한 개인·기기 데이터도 외부 서버에 수집·업로드·공유하지 않습니다."}
    ]},
    {h2:"2. 처리하는 데이터",blocks:[
      {t:"h3",v:"2.1 기기 내에서만 처리되고 업로드되지 않는 데이터"},
      {t:"table",head:["데이터 유형","목적","저장 위치","기기 외부로 나가는가"],rows:[
        ["DNS 쿼리 도메인(차단 및 허용된 것)","로컬 규칙 매칭, 개인정보 보고서","기기 내 비공개 저장소","아니오"],
        ["차단 통계(횟수, 분류, 출처 앱)","개인정보 보고서 표시","기기 내 비공개 저장소","아니오"],
        ["필터 규칙(공개 출처 AdGuard DNS Filter 등)","차단 수행","기기 내 캐시","규칙 텍스트는 공개 출처이며 사용자 쿼리는 업로드되지 않음"],
        ["설정(선택 DNS, TTL, 항상 켜기 VPN 등)","환경설정 복원","기기 내","아니오"],
        ["크래시 로그(로컬 파일 last_crash.log만)","기기에서 확인용","기기 내","아니오"]
      ]},
      {t:"h3",v:"2.2 수집하지 않는 데이터"},
      {t:"list",v:["이름, 이메일, 전화번호 등 신원 정보","정확하거나 대략적인 위치 정보","기기 식별자(IMEI, Android ID, 광고 ID 등)","연락처, SMS, 통화 기록","마이크, 카메라, 사진, 파일 내용","앱 간 행동 프로필","광고 또는 마케팅 목적의 모든 데이터"]}
    ]},
    {h2:"3. 데이터 보안",blocks:[
      {t:"p",v:"모든 규칙·통계·설정은 다른 앱이 접근할 수 없는 앱 전용 샌드박스에 저장됩니다. 당사는 사용자 데이터를 수신·저장하는 서버를 운영하지 않습니다. 로컬 데이터는 표준 기기 내 저장소에 보관됩니다. DNS 쿼리는 사용자가 선택한 상위 리졸버(Cloudflare / Google / AdGuard 등)로만 전달되며 쿼리 내용이 개발자와 공유되는 일은 없습니다."}
    ]},
    {h2:"4. 데이터 보관",blocks:[
      {t:"p",v:"당사는 어떠한 개인 데이터도 서버로 전송하지 않으므로 서버 측 개인 데이터 보관이 없습니다. 기기 내 통계와 로그는 앱 데이터 삭제나 앱 제거 시 제거됩니다."}
    ]},
    {h2:"5. 네트워크 권한 안내",blocks:[
      {t:"table",head:["권한","목적"],rows:[
        ["INTERNET","합법적인 DNS 쿼리를 사용자가 선택한 상위 DNS로 전달"],
        ["ACCESS_NETWORK_STATE","네트워크 상태를 감지하여 VPN 설정/복원"],
        ["QUERY_ALL_PACKAGES","출처 앱별로 로컬 차단 통계 표시(앱 목록은 로컬 참조만, 업로드 안 함)"],
        ["FOREGROUND_SERVICE / FOREGROUND_SERVICE_SPECIAL_USE","특수 용도 포그라운드 서비스로 로컬 VPN 실행"],
        ["POST_NOTIFICATIONS","VPN 상태 알림 표시"],
        ["RECEIVE_BOOT_COMPLETED","재시작 후 설정에 따라 차단 복원"]
      ]}
    ]},
    {h2:"6. 제3자 서비스",blocks:[
      {t:"p",v:"본 앱에는 제3자 분석·광고·크래시 보고 SDK가 포함되어 있지 않습니다. 공개 필터 규칙을 가져오기 위해 표준 HTTPS로 제공처(예: AdGuard 공개 필터 목록)에서 규칙 파일을 다운로드합니다. 이 과정에서 전송되는 것은 규칙 텍스트만이며 사용자의 개인 데이터나 DNS 쿼리는 포함되지 않습니다. 내장 브라우저는 시스템 WebView를 사용하며 그 네트워크 활동은 기기 브라우저의 정책을 따릅니다."}
    ]},
    {h2:"7. 아동의 개인정보",blocks:[
      {t:"p",v:"본 앱은 13세 미만 아동을 대상으로 하지 않으며 어떠한 연령층의 개인 데이터도 의도적으로 수집하지 않습니다."}
    ]},
    {h2:"8. 사용자의 권리",blocks:[
      {t:"p",v:"당사는 어떠한 개인 데이터도 수집·업로드하지 않으므로 서버 데이터를 삭제하거나 내보낼 필요가 없습니다. 언제든 앱을 제거하여 모든 로컬 데이터를 삭제할 수 있습니다."}
    ]},
    {h2:"9. 방침 변경",blocks:[
      {t:"p",v:"향후 데이터 처리 방식이 변경되면 본 문서의 시행일을 갱신하고 사용자에게 안내합니다."}
    ]},
    {h2:"10. 문의처",blocks:[
      {t:"p",v:"본 방침에 대한 문의는 앱 내 피드백 채널 또는 프로젝트 저장소 Issues로 연락해 주세요."}
    ]}
  ],
  foot:"본 방침은 간체 중국어와 영어로 제공됩니다. Ad Blocker · 시행일 2026-08-07"
},

es:{
  title:"Política de Privacidad", sub:"Ad Blocker · Bloqueador de anuncios y rastreadores por VPN / DNS en el dispositivo",
  pills:["Vigente: 2026-08-07","Responsable: Equipo de Ad Blocker","Minimización de datos"],
  note:"Todo el filtrado, las estadísticas y el diagnóstico se procesan localmente en su dispositivo. Esta app no recopila, sube ni comparte ningún dato personal. No hay sistema de cuentas, ni SDK de publicidad, ni SDK de analítica, ni servicio de informes de fallos.",
  sections:[
    {h2:"1. Resumen",blocks:[
      {t:"p",v:"Esta app es un bloqueador de anuncios que funciona en el dispositivo. Usa el VpnService de Android para bloquear anuncios, rastreadores y dominios maliciosos en la capa DNS. Todo el filtrado, las estadísticas y el diagnóstico se procesan localmente en su dispositivo."},
      {t:"p",v:"Seguimos el principio de minimización de datos: esta app no recopila, sube ni comparte ningún dato personal o del dispositivo con ningún servidor externo."}
    ]},
    {h2:"2. Datos que tratamos",blocks:[
      {t:"h3",v:"2.1 Datos tratados solo en el dispositivo (nunca subidos)"},
      {t:"table",head:["Dato","Propósito","Almacenamiento","¿Sale del dispositivo?"],rows:[
        ["Dominios de consultas DNS (bloqueados y permitidos)","Coincidencia local de reglas, informe de privacidad","Almacenamiento privado del dispositivo","No"],
        ["Estadísticas de bloqueo (conteos, categorías, app de origen)","Mostrar informe de privacidad","Almacenamiento privado del dispositivo","No"],
        ["Reglas de filtrado (incl. AdGuard DNS Filter público)","Bloquear","Caché local","El texto de reglas es público; sus consultas no se suben"],
        ["Ajustes (DNS elegido, TTL, VPN siempre activa…)","Restaurar preferencias","Local del dispositivo","No"],
        ["Registros de fallos (solo archivo local last_crash.log)","Visualización en el dispositivo","Local del dispositivo","No"]
      ]},
      {t:"h3",v:"2.2 Datos que NO recopilamos"},
      {t:"list",v:["Nombres, correos, números de teléfono","Ubicación precisa o aproximada","Identificadores de dispositivo (IMEI, Android ID, ID de publicidad)","Contactos, SMS, registros de llamadas","Micrófono, cámara, fotos, contenido de archivos","Perfiles de comportamiento entre apps","Cualquier dato con fines publicitarios o de marketing"]}
    ]},
    {h2:"3. Seguridad de los datos",blocks:[
      {t:"p",v:"Todas las reglas, estadísticas y ajustes se guardan en el sandbox privado de la app, inaccesible para otras apps. No operamos servidores que reciban o almacenen sus datos. Los datos locales se guardan en el almacenamiento estándar del dispositivo. Las consultas DNS se reenvían solo al resolvedor ascendente que elija (Cloudflare / Google / AdGuard); el contenido de las consultas nunca se comparte con el desarrollador."}
    ]},
    {h2:"4. Conservación de datos",blocks:[
      {t:"p",v:"Como no transmitimos ningún dato personal a ningún servidor, no hay conservación de datos personales en el servidor. Las estadísticas y registros locales se eliminan al borrar los datos de la app o desinstalarla."}
    ]},
    {h2:"5. Permisos de red",blocks:[
      {t:"table",head:["Permiso","Propósito"],rows:[
        ["INTERNET","Reenviar consultas DNS legítimas al DNS ascendente elegido"],
        ["ACCESS_NETWORK_STATE","Detectar el estado de red para establecer/restaurar la VPN"],
        ["QUERY_ALL_PACKAGES","Atribuir estadísticas de bloqueo locales por app de origen (solo lectura local de la lista de apps, no se sube)"],
        ["FOREGROUND_SERVICE / FOREGROUND_SERVICE_SPECIAL_USE","Ejecutar la VPN local como servicio en primer plano de uso especial"],
        ["POST_NOTIFICATIONS","Mostrar notificación del estado de la VPN"],
        ["RECEIVE_BOOT_COMPLETED","Restaurar el bloqueo tras reiniciar según sus ajustes"]
      ]}
    ]},
    {h2:"6. Servicios de terceros",blocks:[
      {t:"p",v:"Esta app no contiene SDK de analítica, publicidad ni informes de fallos de terceros. Para obtener reglas de filtrado públicas, la app descarga archivos de reglas por HTTPS estándar desde proveedores (p. ej., listas públicas de filtros de AdGuard); solo se transfiere el texto de reglas, nunca sus datos personales ni sus consultas DNS. El navegador integrado usa el WebView del sistema, sujeto a la política del navegador de su dispositivo."}
    ]},
    {h2:"7. Privacidad de los menores",blocks:[
      {t:"p",v:"La app no está dirigida a menores de 13 años y no recopila a sabiendas datos personales de ningún grupo de edad."}
    ]},
    {h2:"8. Sus derechos",blocks:[
      {t:"p",v:"Como no recopilamos ni subimos datos personales, no hay datos en servidores que debamos eliminar o exportar. Puede borrar todos los datos locales en cualquier momento desinstalando la app."}
    ]},
    {h2:"9. Cambios en la política",blocks:[
      {t:"p",v:"Si en el futuro cambia el tratamiento de datos, actualizaremos la fecha de vigencia e informaremos a los usuarios."}
    ]},
    {h2:"10. Contacto",blocks:[
      {t:"p",v:"Las dudas sobre esta política pueden enviarse por el canal de feedback dentro de la app o por Issues del repositorio del proyecto."}
    ]}
  ],
  foot:"Esta política se proporciona en chino simplificado e inglés. Ad Blocker · Vigente 2026-08-07"
},

fr:{
  title:"Politique de Confidentialité", sub:"Ad Blocker · Bloqueur d'annonces et de traqueurs par VPN / DNS sur l'appareil",
  pills:["En vigueur : 2026-08-07","Responsable : Équipe Ad Blocker","Minimisation des données"],
  note:"Tout le filtrage, les statistiques et le diagnostic sont traités localement sur votre appareil. Cette application ne collecte, n'envoie ni ne partage aucune donnée personnelle. Il n'y a pas de système de compte, de SDK publicitaire, de SDK d'analytique ni de service de rapport de plantage.",
  sections:[
    {h2:"1. Aperçu",blocks:[
      {t:"p",v:"Cette application est un bloqueur de publicités fonctionnant sur l'appareil. Elle utilise le VpnService d'Android pour bloquer les annonces, les traqueurs et les domaines malveillants au niveau DNS. Tout le filtrage, les statistiques et le diagnostic sont traités localement sur votre appareil."},
      {t:"p",v:"Nous suivons le principe de minimisation des données : cette application ne collecte, n'envoie ni ne partage aucune donnée personnelle ou de l'appareil vers un serveur externe."}
    ]},
    {h2:"2. Données traitées",blocks:[
      {t:"h3",v:"2.1 Données traitées uniquement sur l'appareil (jamais envoyées)"},
      {t:"table",head:["Donnée","Finalité","Stockage","Quitte l'appareil ?"],rows:[
        ["Domaines des requêtes DNS (bloqués et autorisés)","Correspondance locale des règles, rapport de confidentialité","Stockage privé de l'appareil","Non"],
        ["Statistiques de blocage (comptes, catégories, app source)","Afficher le rapport de confidentialité","Stockage privé de l'appareil","Non"],
        ["Règles de filtrage (dont AdGuard DNS Filter public)","Blocage","Cache local","Le texte des règles est public ; vos requêtes ne sont pas envoyées"],
        ["Paramètres (DNS choisi, TTL, VPN toujours actif…)","Restaurer les préférences","Local de l'appareil","Non"],
        ["Journaux de plantage (fichier local last_crash.log uniquement)","Consultation sur l'appareil","Local de l'appareil","Non"]
      ]},
      {t:"h3",v:"2.2 Données que nous ne collectons PAS"},
      {t:"list",v:["Noms, e-mails, numéros de téléphone","Localisation précise ou approximative","Identifiants d'appareil (IMEI, Android ID, ID publicitaire)","Contacts, SMS, journaux d'appels","Microphone, caméra, photos, contenu de fichiers","Profils comportementaux inter-applications","Toute donnée à des fins publicitaires ou marketing"]}
    ]},
    {h2:"3. Sécurité des données",blocks:[
      {t:"p",v:"Toutes les règles, statistiques et paramètres sont stockés dans le sandbox privé de l'application, inaccessible aux autres apps. Nous n'exploitons aucun serveur recevant ou stockant vos données. Les données locales sont conservées dans le stockage standard de l'appareil. Les requêtes DNS sont transmises uniquement au résolveur amont choisi (Cloudflare / Google / AdGuard) ; le contenu des requêtes n'est jamais partagé avec le développeur."}
    ]},
    {h2:"4. Conservation des données",blocks:[
      {t:"p",v:"Comme nous ne transmettons aucune donnée personnelle à un serveur, il n'y a pas de conservation de données personnelles côté serveur. Les statistiques et journaux locaux sont supprimés lors de l'effacement des données de l'app ou de sa désinstallation."}
    ]},
    {h2:"5. Autorisations réseau",blocks:[
      {t:"table",head:["Autorisation","Finalité"],rows:[
        ["INTERNET","Transmettre les requêtes DNS légitimes au DNS amont choisi"],
        ["ACCESS_NETWORK_STATE","Détecter l'état du réseau pour établir/restaurer le VPN"],
        ["QUERY_ALL_PACKAGES","Attribuer les statistiques de blocage locales par app source (lecture locale de la liste des apps, non envoyée)"],
        ["FOREGROUND_SERVICE / FOREGROUND_SERVICE_SPECIAL_USE","Exécuter le VPN local comme service de premier plan à usage spécial"],
        ["POST_NOTIFICATIONS","Afficher la notification d'état du VPN"],
        ["RECEIVE_BOOT_COMPLETED","Restaurer le blocage après redémarrage selon vos réglages"]
      ]}
    ]},
    {h2:"6. Services tiers",blocks:[
      {t:"p",v:"Cette application ne contient aucun SDK d'analytique, publicitaire ou de rapport de plantage tiers. Pour récupérer des règles de filtrage publiques, l'application télécharge des fichiers de règles via HTTPS standard depuis des fournisseurs (ex. listes publiques de filtres AdGuard) ; seul le texte des règles est transféré, jamais vos données personnelles ni vos requêtes DNS. Le navigateur intégré utilise le WebView système, soumis à la politique du navigateur de votre appareil."}
    ]},
    {h2:"7. Confidentialité des enfants",blocks:[
      {t:"p",v:"L'application n'est pas destinée aux enfants de moins de 13 ans et ne collecte pas sciemment de données personnelles de quelque tranche d'âge que ce soit."}
    ]},
    {h2:"8. Vos droits",blocks:[
      {t:"p",v:"Comme nous ne collectons ni n'envoyons de données personnelles, il n'y a pas de données serveur à supprimer ou exporter. Vous pouvez effacer toutes les données locales à tout moment en désinstallant l'application."}
    ]},
    {h2:"9. Modifications",blocks:[
      {t:"p",v:"Si le traitement des données change à l'avenir, nous mettrons à jour la date d'entrée en vigueur et en informerons les utilisateurs."}
    ]},
    {h2:"10. Contact",blocks:[
      {t:"p",v:"Les questions sur cette politique peuvent être envoyées via le canal de retour dans l'application ou les Issues du dépôt du projet."}
    ]}
  ],
  foot:"Cette politique est fournie en chinois simplifié et en anglais. Ad Blocker · En vigueur le 2026-08-07"

de:{
  title:"Datenschutzerklärung", sub:"Ad Blocker · Werbe- und Tracker-Blocker per VPN / DNS auf dem Gerät",
  pills:["In Kraft: 2026-08-07","Verantwortlich: Ad Blocker Team","Datenminimierung"],
  note:"Die gesamte Filterung, Statistik und Diagnose erfolgt lokal auf Ihrem Gerät. Diese App erfasst, lädt oder teilt keine personenbezogenen Daten. Es gibt kein Kontosystem, kein Werbe-SDK, kein Analyse-SDK und keinen Absturzmeldedienst.",
  sections:[
    {h2:"1. Übersicht",blocks:[
      {t:"p",v:"Diese App ist ein Werbeblocker, der auf dem Gerät läuft. Sie nutzt den Android VpnService, um Werbung, Tracker und bösartige Domains auf der DNS-Ebene zu blockieren. Die gesamte Filterung, Statistik und Diagnose erfolgt lokal auf Ihrem Gerät."},
      {t:"p",v:"Wir befolgen den Grundsatz der Datenminimierung: Diese App erfasst, lädt oder teilt keine personenbezogenen oder gerätebezogenen Daten auf einen externen Server."}
    ]},
    {h2:"2. Verarbeitete Daten",blocks:[
      {t:"h3",v:"2.1 Nur lokal verarbeitete, nicht hochgeladene Daten"},
      {t:"table",head:["Datentyp","Zweck","Speicherort","Verlässt das Gerät?"],rows:[
        ["DNS-Abfragedomains (blockiert & erlaubt)","Lokale Regelzuordnung, Datenschutzbericht","Privater Gerätespeicher","Nein"],
        ["Blockstatistik (Anzahl, Kategorie, Quell-App)","Datenschutzbericht anzeigen","Privater Gerätespeicher","Nein"],
        ["Filterregeln (inkl. öff. AdGuard DNS Filter)","Blockieren","Lokaler Cache","Regeltext ist öffentlich; Ihre Abfragen werden nicht hochgeladen"],
        ["Einstellungen (gewähltes DNS, TTL, Always-on-VPN…)","Präferenzen wiederherstellen","Lokal auf Gerät","Nein"],
        ["Absturzprotokolle (nur lokale Datei last_crash.log)","Anzeige auf dem Gerät","Lokal auf Gerät","Nein"]
      ]},
      {t:"h3",v:"2.2 Daten, die wir NICHT erheben"},
      {t:"list",v:["Namen, E-Mails, Telefonnummern","Genauer oder ungefährer Standort","Gerätekennungen (IMEI, Android ID, Werbe-ID)","Kontakte, SMS, Anrufprotokolle","Mikrofon, Kamera, Fotos, Dateiinhalte","Verhaltensprofile über Apps hinweg","Beliebige Daten zu Werbe- oder Marketingzwecken"]}
    ]},
    {h2:"3. Datensicherheit",blocks:[
      {t:"p",v:"Alle Regeln, Statistiken und Einstellungen werden im privaten App-Sandbox gespeichert und sind für andere Apps nicht zugänglich. Wir betreiben keine Server, die Ihre Daten empfangen oder speichern. Lokale Daten werden im standardmäßigen Gerätespeicher gehalten. DNS-Abfragen werden nur an den von Ihnen gewählten Upstream-Resolver (Cloudflare / Google / AdGuard) weitergeleitet; der Abfrageinhalt wird niemals mit dem Entwickler geteilt."}
    ]},
    {h2:"4. Datenspeicherung",blocks:[
      {t:"p",v:"Da wir keine personenbezogenen Daten an einen Server übertragen, gibt es keine serverseitige Speicherung personenbezogener Daten. Lokale Statistiken und Protokolle werden beim Löschen der App-Daten oder Deinstallieren entfernt."}
    ]},
    {h2:"5. Netzwerkberechtigungen",blocks:[
      {t:"table",head:["Berechtigung","Zweck"],rows:[
        ["INTERNET","Legitime DNS-Abfragen an gewählten Upstream-DNS weiterleiten"],
        ["ACCESS_NETWORK_STATE","Netzwerkstatus erkennen, um VPN aufzubauen/wiederherzustellen"],
        ["QUERY_ALL_PACKAGES","Lokale Blockstatistik nach Quell-App zuordnen (nur lokale App-Liste, nicht hochgeladen)"],
        ["FOREGROUND_SERVICE / FOREGROUND_SERVICE_SPECIAL_USE","Lokales VPN als Vordergrund-Dienst zu Spezialzwecken ausführen"],
        ["POST_NOTIFICATIONS","VPN-Statusbenachrichtigung anzeigen"],
        ["RECEIVE_BOOT_COMPLETED","Blockierung nach Neustart gemäß Einstellungen wiederherstellen"]
      ]}
    ]},
    {h2:"6. Drittanbieterdienste",blocks:[
      {t:"p",v:"Diese App enthält keine Analyse-, Werbe- oder Absturzmelde-SDKs von Drittanbietern. Zum Abrufen öffentlicher Filterregeln lädt die App Regeldateien per Standard-HTTPS von Anbietern (z. B. öffentliche AdGuard-Filterlisten) herunter; dabei wird nur der Regeltext übertragen, nie Ihre personenbezogenen Daten oder DNS-Abfragen. Der integrierte Browser nutzt das systemeigene WebView und unterliegt der Richtlinie des Gerätebrowsers."}
    ]},
    {h2:"7. Datenschutz von Kindern",blocks:[
      {t:"p",v:"Die App richtet sich nicht an Kinder unter 13 Jahren und erfasst wissentlich keine personenbezogenen Daten einer Altersgruppe."}
    ]},
    {h2:"8. Ihre Rechte",blocks:[
      {t:"p",v:"Da wir keine personenbezogenen Daten erheben oder hochladen, gibt es keine Serverdaten zum Löschen oder Exportieren. Sie können alle lokalen Daten jederzeit durch Deinstallieren der App löschen."}
    ]},
    {h2:"9. Änderungen",blocks:[
      {t:"p",v:"Ändert sich die Datenverarbeitung künftig, aktualisieren wir das Inkrafttreten und informieren die Nutzer."}
    ]},
    {h2:"10. Kontakt",blocks:[
      {t:"p",v:"Fragen zu dieser Richtlinie können über den Feedback-Kanal in der App oder die Issues des Projekt-Repositories gestellt werden."}
    ]}
  ],
  foot:"Diese Richtlinie liegt in vereinfachtem Chinesisch und Englisch vor. Ad Blocker · In Kraft seit 2026-08-07"
},

pt:{
  title:"Política de Privacidade", sub:"Ad Blocker · Bloqueador de anúncios e rastreadores por VPN / DNS no dispositivo",
  pills:["Em vigor: 2026-08-07","Responsável: Equipa Ad Blocker","Minimização de dados"],
  note:"Toda a filtragem, estatísticas e diagnóstico são processados localmente no seu dispositivo. Esta app não recolhe, envia nem partilha quaisquer dados pessoais. Não existe sistema de contas, SDK de publicidade, SDK de analítica nem serviço de relatório de falhas.",
  sections:[
    {h2:"1. Resumo",blocks:[
      {t:"p",v:"Esta app é um bloqueador de anúncios que funciona no dispositivo. Usa o VpnService do Android para bloquear anúncios, rastreadores e domínios maliciosos na camada DNS. Toda a filtragem, estatísticas e diagnóstico são processados localmente no seu dispositivo."},
      {t:"p",v:"Seguimos o princípio da minimização de dados: esta app não recolhe, envia nem partilha quaisquer dados pessoais ou do dispositivo com qualquer servidor externo."}
    ]},
    {h2:"2. Dados que tratamos",blocks:[
      {t:"h3",v:"2.1 Dados tratados apenas no dispositivo (nunca enviados)"},
      {t:"table",head:["Dado","Finalidade","Armazenamento","Sai do dispositivo?"],rows:[
        ["Domínios de consultas DNS (bloqueados e permitidos)","Correspondência local de regras, relatório de privacidade","Armazenamento privado do dispositivo","Não"],
        ["Estatísticas de bloqueio (contagens, categorias, app de origem)","Mostrar relatório de privacidade","Armazenamento privado do dispositivo","Não"],
        ["Regras de filtragem (incl. AdGuard DNS Filter público)","Bloquear","Cache local","O texto de regras é público; as suas consultas não são enviadas"],
        ["Definições (DNS escolhido, TTL, VPN sempre ativa…)","Restaurar preferências","Local do dispositivo","Não"],
        ["Registos de falhas (apenas ficheiro local last_crash.log)","Visualização no dispositivo","Local do dispositivo","Não"]
      ]},
      {t:"h3",v:"2.2 Dados que NÃO recolhemos"},
      {t:"list",v:["Nomes, e-mails, números de telefone","Localização precisa ou aproximada","Identificadores de dispositivo (IMEI, Android ID, ID de publicidade)","Contactos, SMS, registos de chamadas","Microfone, câmara, fotografias, conteúdo de ficheiros","Perfis comportamentais entre apps","Quaisquer dados para fins publicitários ou de marketing"]}
    ]},
    {h2:"3. Segurança dos dados",blocks:[
      {t:"p",v:"Todas as regras, estatísticas e definições são guardadas no sandbox privado da app, inacessível a outras apps. Não operamos servidores que recebam ou armazenem os seus dados. Os dados locais são mantidos no armazenamento padrão do dispositivo. As consultas DNS são encaminhadas apenas para o resolvedor ascendente que escolher (Cloudflare / Google / AdGuard); o conteúdo das consultas nunca é partilhado com o programador."}
    ]},
    {h2:"4. Retenção de dados",blocks:[
      {t:"p",v:"Como não transmitimos quaisquer dados pessoais a qualquer servidor, não há retenção de dados pessoais no servidor. As estatísticas e registos locais são removidos ao limpar os dados da app ou desinstalá-la."}
    ]},
    {h2:"5. Permissões de rede",blocks:[
      {t:"table",head:["Permissão","Finalidade"],rows:[
        ["INTERNET","Reencaminhar consultas DNS legítimas para o DNS ascendente escolhido"],
        ["ACCESS_NETWORK_STATE","Detetar o estado da rede para estabelecer/restaurar a VPN"],
        ["QUERY_ALL_PACKAGES","Atribuir estatísticas de bloqueio locais por app de origem (apenas leitura local da lista de apps, não enviada)"],
        ["FOREGROUND_SERVICE / FOREGROUND_SERVICE_SPECIAL_USE","Executar a VPN local como serviço em primeiro plano de uso especial"],
        ["POST_NOTIFICATIONS","Mostrar notificação do estado da VPN"],
        ["RECEIVE_BOOT_COMPLETED","Restaurar o bloqueio após reinício conforme as suas definições"]
      ]}
    ]},
    {h2:"6. Serviços de terceiros",blocks:[
      {t:"p",v:"Esta app não contém SDK de analítica, publicidade ou relatório de falhas de terceiros. Para obter regras de filtragem públicas, a app descarrega ficheiros de regras via HTTPS padrão a partir de fornecedores (ex.: listas públicas de filtros AdGuard); apenas o texto de regras é transferido, nunca os seus dados pessoais nem as suas consultas DNS. O navegador integrado usa o WebView do sistema, sujeito à política do navegador do seu dispositivo."}
    ]},
    {h2:"7. Privacidade de menores",blocks:[
      {t:"p",v:"A app não se destina a crianças menores de 13 anos e não recolhe conscientemente dados pessoais de qualquer faixa etária."}
    ]},
    {h2:"8. Os seus direitos",blocks:[
      {t:"p",v:"Como não recolhemos nem enviamos dados pessoais, não há dados de servidor para eliminar ou exportar. Pode limpar todos os dados locais a qualquer momento desinstalando a app."}
    ]},
    {h2:"9. Alterações",blocks:[
      {t:"p",v:"Se o tratamento de dados mudar no futuro, atualizaremos a data de entrada em vigor e informaremos os utilizadores."}
    ]},
    {h2:"10. Contacto",blocks:[
      {t:"p",v:"Dúvidas sobre esta política podem ser enviadas pelo canal de feedback na app ou pelas Issues do repositório do projeto."}
    ]}
  ],
  foot:"Esta política é fornecida em chinês simplificado e inglês. Ad Blocker · Em vigor desde 2026-08-07"
},

it:{
  title:"Informativa sulla Privacy", sub:"Ad Blocker · Bloccatore di annunci e tracker tramite VPN / DNS sul dispositivo",
  pills:["In vigore: 2026-08-07","Titolare: Team Ad Blocker","Minimizzazione dei dati"],
  note:"Tutto il filtraggio, le statistiche e la diagnostica sono elaborati localmente sul tuo dispositivo. Questa app non raccoglie, carica né condivide alcun dato personale. Non esiste un sistema di account, SDK pubblicitario, SDK di analisi né servizio di segnalazione crash.",
  sections:[
    {h2:"1. Panoramica",blocks:[
      {t:"p",v:"Questa app è un blocco annunci che funziona sul dispositivo. Usa il VpnService di Android per bloccare annunci, tracker e domini malevoli a livello DNS. Tutto il filtraggio, le statistiche e la diagnostica sono elaborati localmente sul tuo dispositivo."},
      {t:"p",v:"Seguiamo il principio della minimizzazione dei dati: questa app non raccoglie, carica né condivide alcun dato personale o del dispositivo con alcun server esterno."}
    ]},
    {h2:"2. Dati trattati",blocks:[
      {t:"h3",v:"2.1 Dati trattati solo sul dispositivo (mai caricati)"},
      {t:"table",head:["Dato","Scopo","Archiviazione","Esce dal dispositivo?"],rows:[
        ["Domini delle query DNS (bloccati e consentiti)","Corrispondenza locale delle regole, report privacy","Archiviazione privata del dispositivo","No"],
        ["Statistiche di blocco (conteggi, categorie, app origine)","Mostrare il report privacy","Archiviazione privata del dispositivo","No"],
        ["Regole di filtro (incl. AdGuard DNS Filter pubblico)","Bloccare","Cache locale","Il testo delle regole è pubblico; le tue query non sono caricate"],
        ["Impostazioni (DNS scelto, TTL, VPN sempre attiva…)","Ripristinare le preferenze","Locale del dispositivo","No"],
        ["Log di crash (solo file locale last_crash.log)","Visualizzazione sul dispositivo","Locale del dispositivo","No"]
      ]},
      {t:"h3",v:"2.2 Dati che NON raccogliamo"},
      {t:"list",v:["Nomi, email, numeri di telefono","Posizione precisa o approssimativa","Identificatori del dispositivo (IMEI, Android ID, ID pubblicitario)","Contatti, SMS, registri delle chiamate","Microfono, fotocamera, foto, contenuti di file","Profili comportamentali tra app","Qualsiasi dato per scopi pubblicitari o di marketing"]}
    ]},
    {h2:"3. Sicurezza dei dati",blocks:[
      {t:"p",v:"Tutte le regole, statistiche e impostazioni sono salvate nel sandbox privato dell'app, inaccessibile ad altre app. Non gestiamo server che ricevano o memorizzino i tuoi dati. I dati locali sono conservati nella memoria standard del dispositivo. Le query DNS sono inoltrate solo al resolver upstream scelto (Cloudflare / Google / AdGuard); il contenuto delle query non è mai condiviso con lo sviluppatore."}
    ]},
    {h2:"4. Conservazione dei dati",blocks:[
      {t:"p",v:"Poiché non trasmettiamo alcun dato personale a un server, non esiste conservazione di dati personali lato server. Statistiche e log locali sono rimossi cancellando i dati dell'app o disinstallandola."}
    ]},
    {h2:"5. Autorizzazioni di rete",blocks:[
      {t:"table",head:["Autorizzazione","Scopo"],rows:[
        ["INTERNET","Inoltrare query DNS legittime al DNS upstream scelto"],
        ["ACCESS_NETWORK_STATE","Rilevare lo stato della rete per stabilire/ripristinare la VPN"],
        ["QUERY_ALL_PACKAGES","Attribuire statistiche di blocco locali per app di origine (solo lettura locale dell'elenco app, non caricato)"],
        ["FOREGROUND_SERVICE / FOREGROUND_SERVICE_SPECIAL_USE","Eseguire la VPN locale come servizio in primo piano ad uso speciale"],
        ["POST_NOTIFICATIONS","Mostrare la notifica di stato della VPN"],
        ["RECEIVE_BOOT_COMPLETED","Ripristinare il blocco dopo il riavvio secondo le tue impostazioni"]
      ]}
    ]},
    {h2:"6. Servizi di terze parti",blocks:[
      {t:"p",v:"Questa app non contiene SDK di analisi, pubblicitari o di segnalazione crash di terze parti. Per ottenere regole di filtro pubbliche, l'app scarica file di regole tramite HTTPS standard dai fornitori (es. elenchi pubblici di filtri AdGuard); viene trasferito solo il testo delle regole, mai i tuoi dati personali o le tue query DNS. Il browser integrato usa il WebView di sistema, soggetto alla politica del browser del dispositivo."}
    ]},
    {h2:"7. Privacy dei minori",blocks:[
      {t:"p",v:"L'app non è destinata a minori di 13 anni e non raccoglie consapevolmente dati personali di alcuna fascia di età."}
    ]},
    {h2:"8. I tuoi diritti",blocks:[
      {t:"p",v:"Poiché non raccogliamo né carichiamo dati personali, non ci sono dati server da eliminare o esportare. Puoi cancellare tutti i dati locali in qualsiasi momento disinstallando l'app."}
    ]},
    {h2:"9. Modifiche",blocks:[
      {t:"p",v:"Se il trattamento dei dati cambierà in futuro, aggiorneremo la data di entrata in vigore e informeremo gli utenti."}
    ]},
    {h2:"10. Contatti",blocks:[
      {t:"p",v:"Eventuali domande su questa informativa possono essere inviate tramite il canale di feedback nell'app o le Issues del repository del progetto."}
    ]}
  ],
  foot:"Questa informativa è fornita in cinese semplificato e inglese. Ad Blocker · In vigore dal 2026-08-07"
},

ru:{
  title:"Политика конфиденциальности", sub:"Ad Blocker · Блокировщик рекламы и трекеров через VPN / DNS на устройстве",
  pills:["Действует с: 2026-08-07","Ответственный: Команда Ad Blocker","Минимизация данных"],
  note:"Вся фильтрация, статистика и диагностика обрабатываются локально на вашем устройстве. Это приложение не собирает, не загружает и не передаёт никакие персональные данные. В нём нет системы учётных записей, рекламного SDK, аналитического SDK и сервиса отчётов о сбоях.",
  sections:[
    {h2:"1. Обзор",blocks:[
      {t:"p",v:"Это приложение — блокировщик рекламы, работающий на устройстве. Оно использует Android VpnService для блокировки рекламы, трекеров и вредоносных доменов на уровне DNS. Вся фильтрация, статистика и диагностика обрабатываются локально на вашем устройстве."},
      {t:"p",v:"Мы придерживаемся принципа минимизации данных: это приложение не собирает, не загружает и не передаёт никакие персональные или устройственные данные на внешний сервер."}
    ]},
    {h2:"2. Обрабатываемые данные",blocks:[
      {t:"h3",v:"2.1 Данные, обрабатываемые только на устройстве (никогда не загружаются)"},
      {t:"table",head:["Тип данных","Назначение","Место хранения","Покидают устройство?"],rows:[
        ["Домены DNS-запросов (заблокированные и разрешённые)","Локальное сопоставление правил, отчёт о приватности","Частое хранилище устройства","Нет"],
        ["Статистика блокировок (число, категории, исходное приложение)","Показ отчёта о приватности","Частое хранилище устройства","Нет"],
        ["Правила фильтрации (вкл. публичный AdGuard DNS Filter)","Блокировка","Локальный кэш","Текст правил публичный; ваши запросы не загружаются"],
        ["Настройки (выбранный DNS, TTL, всегда включённый VPN…)","Восстановление предпочтений","Локально на устройстве","Нет"],

nl:{
  title:"Privacybeleid", sub:"Ad Blocker · Advertentie- en trackerblokkering via VPN / DNS op het apparaat",
  pills:["Van kracht: 2026-08-07","Verantwoordelijke: Ad Blocker-team","Gegevensminimalisatie"],
  note:"Alle filtering, statistieken en diagnostiek worden lokaal op uw apparaat verwerkt. Deze app verzamelt, uploadt of deelt geen enkele persoonsgegeven. Er is geen accountsysteem, geen advertentie-SDK, geen analys-SDK en geen crashrapportageservice.",
  sections:[
    {h2:"1. Overzicht",blocks:[
      {t:"p",v:"Deze app is een advertentieblokkering die op het apparaat werkt. Hij gebruikt de Android VpnService om advertenties, trackers en kwaadaardige domeinen op DNS-niveau te blokkeren. Alle filtering, statistieken en diagnostiek worden lokaal op uw apparaat verwerkt."},
      {t:"p",v:"Wij hanteren het principe van gegevensminimalisatie: deze app verzamelt, uploadt of deelt geen enkele persoonlijke of apparaatgegevens met een externe server."}
    ]},
    {h2:"2. Gegevens die wij verwerken",blocks:[
      {t:"h3",v:"2.1 Alleen lokaal op het apparaat verwerkte, niet geüploade gegevens"},
      {t:"table",head:["Gegevenstype","Doel","Opslag","Verlaat apparaat?"],rows:[
        ["DNS-querydomeinen (geblokkeerd & toegestaan)","Lokale regelkoppeling, privacyrapport","Privéopslag apparaat","Nee"],
        ["Blokkeringsstatistieken (aantallen, categorieën, bron-app)","Privacyrapport tonen","Privéopslag apparaat","Nee"],
        ["Filterregels (o.a. openbare AdGuard DNS Filter)","Blokkeren","Lokale cache","Regeltekst is openbaar; uw queries worden niet geüpload"],
        ["Instellingen (gekozen DNS, TTL, altijd-aan VPN…)","Voorkeuren herstellen","Lokaal op apparaat","Nee"],
        ["Crashlogs (alleen lokaal bestand last_crash.log)","Weergave op apparaat","Lokaal op apparaat","Nee"]
      ]},
      {t:"h3",v:"2.2 Gegevens die wij NIET verzamelen"},
      {t:"list",v:["Namen, e-mails, telefoonnummers","Nauwkeurige of geschatte locatie","Apparaatidentificatoren (IMEI, Android ID, advertentie-ID)","Contacten, sms, oproepgeschiedenis","Microfoon, camera, foto's, bestandsinhoud","Gedragsprofielen tussen apps","Gegevens voor advertentie- of marketingdoeleinden"]}
    ]},
    {h2:"3. Gegevensbeveiliging",blocks:[
      {t:"p",v:"Alle regels, statistieken en instellingen worden opgeslagen in de privésandbox van de app, niet toegankelijk voor andere apps. Wij exploiteren geen servers die uw gegevens ontvangen of opslaan. Lokale gegevens worden in de standaardopslag van het apparaat bewaard. DNS-queries worden alleen doorgestuurd naar de door u gekozen upstream-resolver (Cloudflare / Google / AdGuard); de queryinhoud wordt nooit met de ontwikkelaar gedeeld."}
    ]},
    {h2:"4. Gegevensbewaring",blocks:[
      {t:"p",v:"Omdat wij geen persoonsgegevens naar een server verzenden, is er geen server-side bewaring van persoonsgegevens. Lokale statistieken en logs worden verwijderd bij het wissen van app-gegevens of het verwijderen van de app."}
    ]},
    {h2:"5. Netwerkmachtingen",blocks:[

        ["ACCESS_NETWORK_STATE","Netwerkstatus detecteren om VPN op te zetten/te herstellen"],

        ["POST_NOTIFICATIONS","VPN-statusmelding tonen"],
        ["RECEIVE_BOOT_COMPLETED","Blokkering na herstart herstellen volgens uw instellingen"]
      ]}
    ]},
    {h2:"6. Diensten van derden",blocks:[

    ]},
    {h2:"7. Privacy van kinderen",blocks:[
      {t:"p",v:"De app is niet gericht op kinderen onder de 13 jaar en verzamelt niet bewust persoonsgegevens van enige leeftijdsgroep."}
    ]},
    {h2:"8. Uw rechten",blocks:[
      {t:"p",v:"Omdat wij geen persoonsgegevens verzamelen of uploaden, zijn er geen servergegevens om te verwijderen of exporteren. U kunt alle lokale gegevens op elk moment wissen door de app te verwijderen."}
    ]},
    {h2:"9. Wijzigingen",blocks:[
      {t:"p",v:"Als de gegevensverwerking in de toekomst wijzigt, werken wij de ingangsdatum bij en informeren wij gebruikers."}

      {t:"p",v:"Vragen over dit beleid kunnen worden gestuurd via het feedbackkanaal in de app of de Issues van de projectrepository."}

function render(lang){
  const d = D[lang] || D.en;
  document.documentElement.lang = lang;
  document.body.classList.toggle('rtl', RTL.has(lang));
  document.getElementById('t-title').textContent = d.title;
  document.getElementById('t-sub').textContent = d.sub;
  const pills=[d.pills[0],d.pills[1],d.pills[2]];
  document.getElementById('t-pill1').textContent = pills[0]||'';
  document.getElementById('t-pill2').textContent = pills[1]||'';
  document.getElementById('t-pill3').textContent = pills[2]||'';
  let html='';
  let toc='';
  const n = d.sections.length;
  d.sections.forEach((s, i)=>{
    const sid = 'sec-'+i;
    const label = s.h2.replace(/^[\d一二三四五六七八九十]+[.、\s]*/, '').trim();
    toc += '<a href="#'+sid+'" data-sid="'+sid+'">'+esc(s.h2)+'</a>';
    html += '<section id="'+sid+'"><h2><span class="idx">'+(i+1)+'</span>'+esc(s.h2)+'</h2>';
    for(const b of s.blocks){
      if(b.t==='p') html += '<p>'+esc(b.v)+'</p>';
      else if(b.t==='h3') html += '<h3>'+esc(b.v)+'</h3>';
      else if(b.t==='list'){ html += '<ul>'; for(const li of b.v) html += '<li>'+esc(li)+'</li>'; html += '</ul>'; }
      else if(b.t==='table'){
        html += '<table><thead><tr>';
        for(const h of b.head) html += '<th>'+esc(h)+'</th>';
        html += '</tr></thead><tbody>';
        for(const row of b.rows){ html += '<tr>'; for(const c of row) html += '<td>'+esc(c)+'</td>'; html += '</tr>'; }
        html += '</tbody></table>';
      }
    }
    html += '</section>';
  });
  document.getElementById('content').innerHTML = '<div class="note"><span class="ic">✓</span><div>'+esc(d.note)+'</div></div>'+html;
  document.getElementById('t-foot').textContent = d.foot;
  document.getElementById('t-toc').textContent = TOC[lang] || 'Contents';
  document.getElementById('toc-nav').innerHTML = toc;
  bindToc();
  try{ localStorage.setItem('pp_lang', lang); }catch(e){}
}

// 目录高亮 + 平滑滚动
let tocObserver=null;
function bindToc(){
  const links = Array.from(document.querySelectorAll('#toc-nav a'));
  links.forEach(a=>{
    a.addEventListener('click', e=>{
      e.preventDefault();
      const el=document.getElementById(a.getAttribute('data-sid'));
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    });
  });
  if(tocObserver) tocObserver.disconnect();
  tocObserver = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        const id=en.target.id;
        links.forEach(a=>a.classList.toggle('active', a.getAttribute('data-sid')===id));
      }
    });
  },{rootMargin:'-20% 0px -70% 0px',threshold:0});
  document.querySelectorAll('#content section').forEach(s=>tocObserver.observe(s));
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 初始化语言选择器
(function(){
  const sel = document.getElementById('langSel');
  for(const [code,name] of LANGS){
    const o=document.createElement('option'); o.value=code; o.textContent=name; sel.appendChild(o);
  }
  let saved='zh';
  try{ saved=localStorage.getItem('pp_lang')||'zh'; }catch(e){}
  if(!D[saved]) saved='zh';
  sel.value=saved;
  render(saved);
})();
</script>
